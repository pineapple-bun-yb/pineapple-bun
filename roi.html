
<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>百分比计算工具</title>
  <!-- 引入Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- 引入Font Awesome -->
  <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
  
  <!-- 配置Tailwind自定义主题 -->
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: '#165DFF',
            secondary: '#36CFC9',
            tertiary: '#722ED1',
            neutral: '#F5F7FA',
            dark: '#1D2129',
            light: '#86909C'
          },
          fontFamily: {
            inter: ['Inter', 'system-ui', 'sans-serif'],
          },
          boxShadow: {
            'card': '0 10px 30px -5px rgba(0, 0, 0, 0.1)',
            'hover': '0 20px 40px -5px rgba(22, 93, 255, 0.15)',
          }
        },
      }
    }
  </script>
  
  <!-- 自定义工具类 -->
  <style type="text/tailwindcss">
    @layer utilities {
      .content-auto {
        content-visibility: auto;
      }
      .input-focus {
        @apply ring-2 ring-primary/50 border-primary transition-all duration-300;
      }
      .result-fade {
        @apply transition-all duration-500 ease-in-out;
      }
      .result-card {
        @apply p-4 rounded-xl result-fade bg-white border border-gray-100 shadow-sm;
      }
    }
  </style>
  
  <style>
    /* 全局样式 */
    body {
      background-color: #F9FAFC;
      background-image: 
        radial-gradient(circle at 10% 20%, rgba(22, 93, 255, 0.03) 0%, transparent 20%),
        radial-gradient(circle at 90% 80%, rgba(54, 207, 201, 0.03) 0%, transparent 20%);
      min-height: 100vh;
    }
    
    /* 输入框动画 */
    .input-field {
      transition: all 0.3s ease;
    }
    
    .input-field:focus {
      transform: translateY(-1px);
    }
    
    /* 结果数字动画 */
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.8; }
    }
    
    .result-update {
      animation: pulse 0.5s ease-in-out;
    }
    
    /* 错误提示动画 */
    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-5px); }
      75% { transform: translateX(5px); }
    }
    
    .input-error {
      animation: shake 0.3s ease-in-out;
    }
    
    /* 结果卡片动画 */
    @keyframes slideUp {
      from { transform: translateY(10px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }
    
    .result-appear {
      animation: slideUp 0.4s ease-out forwards;
    }
  </style>
</head>

<body class="font-inter text-dark min-h-screen flex flex-col items-center justify-center p-4 md:p-8">
  <!-- 卡片容器 -->
  <div class="w-full max-w-md bg-white rounded-2xl shadow-card hover:shadow-hover transition-all duration-500 overflow-hidden">
    <!-- 卡片头部 -->
    <div class="bg-primary/5 px-6 py-5 border-b border-primary/10">
      <h2 class="text-[clamp(1.25rem,3vw,1.5rem)] font-bold text-primary flex items-center">
        <i class="fa fa-calculator mr-2"></i>百分比计算工具
      </h2>
      <p class="text-light text-sm mt-1">实时计算: 数值 × 0.8 和 (数值 × 0.8) ÷ (百分比 ÷ 100)</p>
    </div>
    
    <!-- 卡片主体 -->
    <div class="p-6 space-y-6">
      <!-- 第一个输入框 -->
      <div class="space-y-2">
        <label for="numberInput" class="block text-sm font-medium text-dark">
          <i class="fa fa-hashtag mr-1 text-primary"></i>基础数值
        </label>
        <div class="relative">
          <input 
            type="text" 
            id="numberInput" 
            class="input-field w-full px-4 py-3 rounded-lg border border-gray-300 focus:outline-none focus:input-focus text-dark"
            placeholder="输入数字（可含小数点）"
            inputmode="decimal"
          >
          <span class="absolute right-3 top-1/2 -translate-y-1/2 text-light">
            <i class="fa fa-number"></i>
          </span>
        </div>
        <p id="numberError" class="text-red-500 text-xs hidden">请输入有效的数字</p>
      </div>
      
      <!-- 第二个输入框 -->
      <div class="space-y-2">
        <label for="percentInput" class="block text-sm font-medium text-dark">
          <i class="fa fa-percent mr-1 text-secondary"></i>百分比 (%)
        </label>
        <div class="relative">
          <input 
            type="text" 
            id="percentInput" 
            class="input-field w-full px-4 py-3 rounded-lg border border-gray-300 focus:outline-none focus:input-focus text-dark"
            placeholder="输入0-100之间的数字"
            inputmode="decimal"
          >
          <span class="absolute right-3 top-1/2 -translate-y-1/2 text-light">
            <i class="fa fa-percent"></i>
          </span>
        </div>
        <p id="percentError" class="text-red-500 text-xs hidden">请输入0-100之间的数字</p>
      </div>
      
      <!-- 结果显示区域 -->
      <div id="resultContainer" class="mt-2 space-y-4 opacity-0 transform translate-y-2 result-fade">
        <!-- 第一个结果：数值 × 0.8 -->
        <div class="result-card result-appear opacity-0" style="animation-delay: 0.1s">
          <div class="flex justify-between items-start">
            <div>
              <h3 class="text-sm font-medium text-light flex items-center">
                <i class="fa fa-calculator text-tertiary mr-1"></i>数值 × 0.8
              </h3>
              <p class="text-xs text-light mt-1" id="multiplierFormula">基础数值 × 0.8 = 结果</p>
            </div>
            <span id="multiplierResult" class="text-xl font-bold text-tertiary">0.00</span>
          </div>
        </div>
        
        <!-- 第二个结果：最终百分比计算 -->
        <div class="result-card result-appear opacity-0" style="animation-delay: 0.2s">
          <div class="flex justify-between items-start">
            <div>
              <h3 class="text-sm font-medium text-light flex items-center">
                <i class="fa fa-percent text-primary mr-1"></i>最终计算结果
              </h3>
              <p class="text-xs text-light mt-1" id="percentFormula">(数值 × 0.8) ÷ (百分比 ÷ 100) = 结果</p>
            </div>
            <span id="finalResult" class="text-xl font-bold text-primary">0.00</span>
          </div>
        </div>
        
        <!-- 计算公式说明 -->
        <div class="bg-neutral/50 p-3 rounded-lg text-xs text-light">
          <p id="calculationDetails" class="hidden">完整计算过程展示</p>
        </div>
      </div>
    </div>
    
    <!-- 卡片底部 -->
    <div class="bg-gray-50 px-6 py-4 border-t border-gray-100 text-center text-light text-xs">
      <p>© 2025 百分比计算工具 | 双结果实时计算版</p>
    </div>
  </div>
  
  <!-- 页脚 -->
  <footer class="mt-8 text-center text-light text-sm">
    <p>输入数字后实时显示两个计算结果，无需额外操作</p>
  </footer>

  <script>
    // 获取DOM元素
    const numberInput = document.getElementById('numberInput');
    const percentInput = document.getElementById('percentInput');
    const resultContainer = document.getElementById('resultContainer');
    const multiplierResult = document.getElementById('multiplierResult');
    const finalResult = document.getElementById('finalResult');
    const multiplierFormula = document.getElementById('multiplierFormula');
    const percentFormula = document.getElementById('percentFormula');
    const calculationDetails = document.getElementById('calculationDetails');
    const numberError = document.getElementById('numberError');
    const percentError = document.getElementById('percentError');
    
    // 防抖函数：避免输入过程中频繁计算
    function debounce(func, delay = 300) {
      let timeoutId;
      return function(...args) {
        clearTimeout(timeoutId);
        timeoutId = setTimeout(() => func.apply(this, args), delay);
      };
    }
    
    // 输入验证函数
    function validateNumberInput(input) {
      // 允许数字和小数点，且只能有一个小数点
      const regex = /^(\d+(\.\d*)?|\.\d+)$/;
      const value = input.value.trim();
      const isValid = value ? regex.test(value) : false;
      
      if (!isValid && value) {
        numberError.classList.remove('hidden');
        numberInput.classList.add('border-red-500', 'input-error');
        setTimeout(() => numberInput.classList.remove('input-error'), 300);
      } else {
        numberError.classList.add('hidden');
        numberInput.classList.remove('border-red-500');
      }
      
      return isValid;
    }
    
    function validatePercentInput(input) {
      // 允许0-100之间的数字，可含小数点
      const regex = /^(\d+(\.\d*)?|\.\d+)$/;
      const value = input.value.trim();
      const numValue = value ? parseFloat(value) : -1;
      const isValid = value ? (regex.test(value) && numValue >= 0 && numValue <= 100) : false;
      
      if (!isValid && value) {
        percentError.classList.remove('hidden');
        percentInput.classList.add('border-red-500', 'input-error');
        setTimeout(() => percentInput.classList.remove('input-error'), 300);
      } else {
        percentError.classList.add('hidden');
        percentInput.classList.remove('border-red-500');
      }
      
      return isValid;
    }
    
    // 计算函数
    function calculateResult() {
      // 获取输入值
      const numberValue = numberInput.value.trim() ? parseFloat(numberInput.value.trim()) : 0;
      const percentValue = percentInput.value.trim() ? parseFloat(percentInput.value.trim()) : 0;
      
      // 验证输入
      const isNumberValid = validateNumberInput(numberInput);
      const isPercentValid = validatePercentInput(percentInput);
      
      // 至少输入基础数值才显示第一个结果
      if (!numberInput.value.trim()) {
        resultContainer.classList.add('opacity-0', 'translate-y-2');
        return;
      }
      
      // 如果数值输入无效，显示错误
      if (!isNumberValid) {
        resultContainer.classList.remove('opacity-0', 'translate-y-2');
        multiplierResult.textContent = '---';
        multiplierFormula.textContent = '输入无效，请检查基础数值';
        
        // 隐藏最终结果
        finalResult.textContent = '---';
        percentFormula.textContent = '请先输入有效的基础数值';
        calculationDetails.classList.add('hidden');
        return;
      }
      
      // 计算第一个结果：数值 × 0.8
      const multiplierValue = numberValue * 0.8;
      multiplierResult.textContent = multiplierValue.toFixed(2);
      multiplierFormula.textContent = `${numberValue.toFixed(2)} × 0.8 = ${multiplierValue.toFixed(2)}`;
      
      // 显示结果容器
      resultContainer.classList.remove('opacity-0', 'translate-y-2');
      resultContainer.classList.add('opacity-100', 'translate-y-0');
      
      // 添加结果卡片动画类
      document.querySelectorAll('.result-card').forEach(card => {
        card.style.opacity = '1';
      });
      
      // 如果没有输入百分比，只显示第一个结果
      if (!percentInput.value.trim()) {
        finalResult.textContent = '等待输入...';
        percentFormula.textContent = '请输入百分比以计算最终结果';
        calculationDetails.classList.add('hidden');
        return;
      }
      
      // 如果百分比输入无效，显示错误
      if (!isPercentValid) {
        finalResult.textContent = '---';
        percentFormula.textContent = '百分比输入无效，请输入0-100之间的数字';
        calculationDetails.classList.add('hidden');
        return;
      }
      
      // 避免除以零
      if (percentValue === 0) {
        percentError.textContent = '百分比不能为0';
        percentError.classList.remove('hidden');
        percentInput.classList.add('border-red-500', 'input-error');
        setTimeout(() => percentInput.classList.remove('input-error'), 300);
        
        finalResult.textContent = '---';
        percentFormula.textContent = '错误：百分比不能为0';
        calculationDetails.classList.add('hidden');
        return;
      }
      
      // 重置百分比错误提示
      if (percentError.textContent === '百分比不能为0') {
        percentError.textContent = '请输入0-100之间的数字';
        percentError.classList.add('hidden');
      }
      
      // 计算最终结果：(数值 × 0.8) ÷ (百分比 ÷ 100)
      const finalValue = multiplierValue / (percentValue / 100);
      finalResult.textContent = finalValue.toFixed(2);
      
      // 更新公式显示
      percentFormula.textContent = 
        `(${numberValue.toFixed(2)} × 0.8) ÷ (${percentValue.toFixed(2)} ÷ 100) = ${finalValue.toFixed(2)}`;
      
      // 显示详细计算过程
      calculationDetails.classList.remove('hidden');
      calculationDetails.innerHTML = 
        `<strong>详细计算过程：</strong><br>
        1. 基础数值 × 0.8 = ${numberValue.toFixed(2)} × 0.8 = ${multiplierValue.toFixed(2)}<br>
        2. 百分比转换为小数 = ${percentValue.toFixed(2)} ÷ 100 = ${(percentValue / 100).toFixed(4)}<br>
        3. 最终结果 = ${multiplierValue.toFixed(2)} ÷ ${(percentValue / 100).toFixed(4)} = ${finalValue.toFixed(2)}`;
      
      // 添加结果更新动画
      multiplierResult.classList.add('result-update');
      finalResult.classList.add('result-update');
      setTimeout(() => {
        multiplierResult.classList.remove('result-update');
        finalResult.classList.remove('result-update');
      }, 500);
    }
    
    // 输入框事件监听 - 只允许输入数字和小数点，并实时计算
    numberInput.addEventListener('input', function(e) {
      // 移除非数字和非小数点字符
      this.value = this.value.replace(/[^0-9.]/g, '');
      // 确保只有一个小数点
      const parts = this.value.split('.');
      if (parts.length > 2) {
        this.value = parts[0] + '.' + parts.slice(1).join('');
      }
      
      // 实时计算（带防抖）
      debounceCalculate();
    });
    
    percentInput.addEventListener('input', function(e) {
      // 移除非数字和非小数点字符
      this.value = this.value.replace(/[^0-9.]/g, '');
      // 确保只有一个小数点
      const parts = this.value.split('.');
      if (parts.length > 2) {
        this.value = parts[0] + '.' + parts.slice(1).join('');
      }
      
      // 实时计算（带防抖）
      debounceCalculate();
    });
    
    // 初始化防抖计算函数
    const debounceCalculate = debounce(calculateResult, 200);
    
    // 输入框失焦时再次触发计算（确保最终结果正确）
    numberInput.addEventListener('blur', calculateResult);
    percentInput.addEventListener('blur', calculateResult);
  </script>
</body>
</html>
